name: Build and publish to PyPI and TestPyPI

# from packaging tutorial: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

# Trigger the workflow on push to a tag (used for releases)
on:
  push:
    tags:
      - "v*" # Push events to matching v*, like v1.0, v20.15.10

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # Step 1: Checkout the repository
      - name: Checkout the repository
        uses: actions/checkout@v4

      # Step 2: Set up Conda with caching
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          python-version: "3.10"

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-build-${{ hashFiles('pyproject.toml') }}

      # Step 3: Create and activate build environment
      - name: Create & activate Build Env
        run: |
          eval "$(conda shell.bash hook)"
          conda create -y -n buildenv python=3.10 rdkit -c conda-forge
          conda activate buildenv

      # Step 4: Install build tools
      - name: Install build tools
        run: |
          eval "$(conda shell.bash hook)"
          conda activate buildenv
          pip install --upgrade pip build twine

      # Step 5: Run tests before building
      - name: Run tests
        run: |
          eval "$(conda shell.bash hook)"
          conda activate buildenv
          pip install -e .[test]
          python -m pytest tests/ --tb=short

      # Step 6: Build distribution using modern build tool
      - name: Build distribution
        run: |
          eval "$(conda shell.bash hook)"
          conda activate buildenv
          python -m build

      # Step 6: Validate the distribution
      - name: Validate the distribution
        run: |
          eval "$(conda shell.bash hook)"
          conda activate buildenv
          twine check dist/*

      # Step 7: Store the distribution artifacts for later use
      - name: Store the distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }} # Only run for stable tags (no '-' in tag name)
    defaults:
      run:
        shell: bash
    environment:
      name: pypi
      url: https://pypi.org/project/laplaciannb/
    permissions:
      contents: read
      id-token: write # For trusted publishing
    steps:
      # Step 1: Download the distribution artifacts
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      # Step 2: Set up Miniconda
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false

      # Step 3: Create and activate a new environment called "pypienv"
      - name: Create & activate PyPi Env
        run: |
          eval "$(conda shell.bash hook)"
          conda create -y -n pypienv python=3.10 rdkit -c conda-forge
          conda activate pypienv
          pip install --upgrade pip
          pip install twine

      # Step 4: Publish distribution to PyPI using official action
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.ref_name, '-') # Only run for beta tags (contains '-' in tag name)
    defaults:
      run:
        shell: bash
    environment:
      name: testpypi
      url: https://test.pypi.org/project/laplaciannb/
    permissions:
      contents: read
      id-token: write # For trusted publishing
    steps:
      # Step 1: Download the distribution artifacts
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      # Step 2: Set up Miniconda
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false

      # Step 3: Create and activate a new environment called "testenv"
      - name: Create & activate Test Env
        run: |
          eval "$(conda shell.bash hook)"
          conda create -y -n testenv python=3.10 rdkit -c conda-forge
          conda activate testenv
          pip install --upgrade pip
          pip install twine

      # Step 4: Publish distribution to TestPyPI using official action
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  github-release:
    name: Create a GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # Step 1: Checkout the repository
      - name: Checkout the repository
        uses: actions/checkout@v4

      # Step 2: Download the distribution artifacts
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      # Step 3: Debug dist files
      - name: Debug dist files
        run: |
          echo "Listing dist files"
          ls -la dist
      # Step 4: Create a GitHub release
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            - This is the automatically generated release notes for ${{ github.ref_name }}.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # Set to true for beta releases
          artifacts: "dist/*"
          artifactContentType: application/octet-stream
