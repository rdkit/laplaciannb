name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ruff-check:
    name: Ruff Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff linting
        uses: astral-sh/ruff-action@v1
        with:
          args: "check --output-format=github --exit-non-zero-on-fix"
          src: "./src"

      - name: Run Ruff formatting check
        uses: astral-sh/ruff-action@v1
        with:
          args: "format --check"
          src: "./src"

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          python-version: ${{ matrix.python-version }}

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Create test environment
        run: |
          eval "$(conda shell.bash hook)"
          conda create -y -n testenv python=${{ matrix.python-version }} rdkit -c conda-forge
          conda activate testenv
          pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests with coverage
        run: |
          eval "$(conda shell.bash hook)"
          conda activate testenv
          python -m pytest tests/ --tb=short -x --cov=laplaciannb --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
