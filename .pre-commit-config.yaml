repos:
  # Ruff linting and formatting (matches GitHub Actions)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      # Run the linter first (matches CI ruff-check step)
      - id: ruff
        name: ruff-lint
        types_or: [python, pyi]
        args: [--fix, --exit-non-zero-on-fix]
        files: ^src/
      # Run the formatter (matches CI ruff-format step)
      - id: ruff-format
        name: ruff-format
        types_or: [python, pyi]
        files: ^src/

  # Security scanning (matches security.yml workflow)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit-security-scan
        args: [--skip, B101, --quiet]

  # Additional Python code quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Local hooks for testing (matches GitHub Actions test strategy)
  - repo: local
    hooks:
      # Fast syntax check before running full tests
      - id: python-syntax-check
        name: python-syntax-check
        entry: python -m py_compile
        language: system
        files: ^src/.*\.py$

      # Run pytest with coverage (matches CI coverage workflow)
      - id: pytest-check
        name: pytest-with-coverage
        entry: bash -c 'source .venv/bin/activate && python -m pytest tests/ --tb=short -x'
        language: system
        pass_filenames: false
        always_run: true

      # Check that version is properly formatted
      - id: version-check
        name: version-format-check
        entry: python -c "import sys; sys.path.insert(0, 'src'); from laplaciannb import __version__; print('Version:', __version__)"
        language: system
        pass_filenames: false
        files: ^src/laplaciannb/__init__\.py$

  # YAML formatting for GitHub workflows
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier-yaml
        types: [yaml]
        files: ^\.(github|dependabot)/
        additional_dependencies:
          - prettier@3.0.0
